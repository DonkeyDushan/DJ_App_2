name: Build installers

# Builds the desktop installers on native runners:
#   - macOS runner  -> .dmg (x64 + arm64)   <-- cannot be produced on Windows
#   - Windows runner -> .exe NSIS installers (x64 + ia32/32-bit)
#
# Run it manually from the Actions tab (workflow_dispatch), or push a git tag
# like `v0.1.0` to also attach the installers to a GitHub Release.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# The local electron-builder.json points `directories.output` at an absolute
# Windows path (C:/builds/...), which is invalid on the macOS runner. Every job
# overrides it to a relative `release/` folder via -c.directories.output.
env:
  NODE_VERSION: '20'
  OUTPUT_DIR: release

# Needed so the release step can create/update a GitHub Release on tag pushes.
permissions:
  contents: write

jobs:
  build-mac:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and main process
        run: npm run build

      - name: Package macOS installer
        # CSC_IDENTITY_AUTO_DISCOVERY=false builds an UNSIGNED .dmg (no Apple
        # Developer certificate needed). Users open it via right-click -> Open.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac -c.directories.output=${{ env.OUTPUT_DIR }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: dj-app-mac
          path: |
            ${{ env.OUTPUT_DIR }}/*.dmg
            ${{ env.OUTPUT_DIR }}/*.dmg.blockmap
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.OUTPUT_DIR }}/*.dmg

  build-windows:
    name: Windows (.exe, 64-bit + 32-bit)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and main process
        run: npm run build

      - name: Package Windows installers
        # Builds both x64 and ia32 NSIS installers per electron-builder.json.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win -c.directories.output=${{ env.OUTPUT_DIR }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dj-app-windows
          path: |
            ${{ env.OUTPUT_DIR }}/*.exe
            ${{ env.OUTPUT_DIR }}/*.exe.blockmap
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.OUTPUT_DIR }}/*.exe
